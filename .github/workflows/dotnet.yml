# This workflow will build the Windows Agent project on Windows
name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj
    - name: Build with Warnings Surfaced
      run: dotnet build windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj -c Release -p:Platform=x64 --no-restore --warnaserror
