name: Release Windows Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj

      - name: Verify Build (x64) & Fail on Warnings
        run: dotnet build windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj -c Release -p:Platform=x64 --no-restore --warnaserror

      - name: Verify Build (ARM64) & Fail on Warnings
        run: dotnet build windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj -c Release -p:Platform=ARM64 -r win-arm64 --warnaserror

      - name: Publish Self-Contained (win-x64)
        shell: pwsh
        run: |
          dotnet publish windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            --self-contained true `
            -o ./dist/win-x64
          Copy-Item INSTALL.md ./dist/win-x64/INSTALL.md

      - name: Publish Self-Contained (win-arm64)
        shell: pwsh
        run: |
          dotnet publish windows-app/PrintInfinity.Agent/PrintInfinity.Agent.csproj `
            -c Release `
            -r win-arm64 `
            -p:Platform=ARM64 `
            --self-contained true `
            -o ./dist/win-arm64
          Copy-Item INSTALL.md ./dist/win-arm64/INSTALL.md

      - name: Package Archives & Generate SHA256 Checksums
        shell: pwsh
        run: |
          # Compress both architecture distributions
          Compress-Archive -Path ./dist/win-x64/* -DestinationPath ./PrintInfinity-Agent-win-x64.zip -CompressionLevel Optimal
          Compress-Archive -Path ./dist/win-arm64/* -DestinationPath ./PrintInfinity-Agent-win-arm64.zip -CompressionLevel Optimal

          # Generate SHA256 checksums
          $hashX64 = (Get-FileHash -Path ./PrintInfinity-Agent-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashX64  PrintInfinity-Agent-win-x64.zip" | Out-File -FilePath ./PrintInfinity-Agent-win-x64.zip.sha256 -Encoding ascii

          $hashArm64 = (Get-FileHash -Path ./PrintInfinity-Agent-win-arm64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashArm64  PrintInfinity-Agent-win-arm64.zip" | Out-File -FilePath ./PrintInfinity-Agent-win-arm64.zip.sha256 -Encoding ascii

          Write-Host "Release Artifacts created successfully:"
          Get-ChildItem PrintInfinity-Agent-* | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Print Infinity Agent ${{ github.ref_name }}
          body_path: INSTALL.md
          files: |
            PrintInfinity-Agent-win-x64.zip
            PrintInfinity-Agent-win-x64.zip.sha256
            PrintInfinity-Agent-win-arm64.zip
            PrintInfinity-Agent-win-arm64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
